  <feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer>
</filter>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8b5a9" stop-opacity=".2"/>
      <stop offset="1" stop-color="#222725" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#b8b5a9"/>
  <g transform="translate(1200 0) scale(-1 1)">
